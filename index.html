<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artha - Budget Manager (IST)</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Artha</h1>
            <p id="current-date"></p>
        </header>

        <main>
            <!-- Input Section -->
            <section class="card entry-form">
                <h2>Add Transaction</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="Salary, Rent, Groceries..." required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type">
                            <option value="earning">Earning</option>
                            <option value="cost">Cost</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Add Transaction</button>
                </form>
            </section>

            <!-- Dashboard Summaries -->
            <section class="dashboard">
                <div class="card summary daily">
                    <h3>Today</h3>
                    <div class="stats">
                        <div class="stat-item">
                            <span>Profit/Loss</span>
                            <strong id="daily-pl">₹0</strong>
                        </div>
                    </div>
                </div>

                <div class="card summary monthly">
                    <h3>This Month</h3>
                    <div class="stats">
                        <div class="stat-item">
                            <span>Earnings</span>
                            <strong class="text-green" id="monthly-earnings">₹0</strong>
                        </div>
                        <div class="stat-item">
                            <span>Expenditure</span>
                            <strong class="text-red" id="monthly-costs">₹0</strong>
                        </div>
                        <div class="stat-item total">
                            <span>Net Profit/Loss</span>
                            <strong id="monthly-pl">₹0</strong>
                        </div>
                    </div>
                </div>

                <div class="card summary yearly">
                    <h3>This Year</h3>
                    <div class="stats">
                        <div class="stat-item">
                            <span>Earnings</span>
                            <strong id="yearly-earnings">₹0</strong>
                        </div>
                        <div class="stat-item">
                            <span>Costs</span>
                            <strong id="yearly-costs">₹0</strong>
                        </div>
                        <div class="stat-item total">
                            <span>Net Profit/Loss</span>
                            <strong id="yearly-pl">₹0</strong>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Visualization -->
            <section class="card visualization">
                <h2>Monthly Trend</h2>
                <canvas id="budgetChart"></canvas>
            </section>

            <!-- Recent Transactions -->
            <section class="card history">
                <h2>Recent Transactions</h2>
                <ul id="transaction-list">
                    <!-- Transactions will be injected here -->
                </ul>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
